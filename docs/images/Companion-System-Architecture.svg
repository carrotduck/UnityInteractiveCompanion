<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1400" viewBox="0 0 2400 1400">
<title>Unity Interactive Companion system architecture</title>
<rect width="2400" height="1400" fill="#fff"/>
<g font-family="Arial Narrow,Roboto Condensed,sans-serif" fill="#111">
<text x="90" y="50" dominant-baseline="text-before-edge" font-size="68" fill="#111111">Unity Interactive Companion</text>
